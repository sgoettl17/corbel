name: spec-update
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Check Procore's OpenAPI spec and rebuild the index
        id: spec
        run: |
          set +e
          uv run python dev/update_spec.py --write --summary "$RUNNER_TEMP/summary.md"
          code=$?
          set -e
          if [ "$code" -eq 10 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; elif [ "$code" -ne 0 ]; then exit "$code"; fi
      - name: Run checks on the new index
        if: steps.spec.outputs.changed == 'true'
        run: |
          uv run pytest
          uv run python dev/check_plugin.py
      - name: Open a pull request
        if: steps.spec.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="spec-update-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add spec/index
          git commit -m "Update endpoint index from Procore OpenAPI spec"
          git push -u origin "$branch"
          gh pr create --title "Update endpoint index from Procore OpenAPI spec" \
            --body-file "$RUNNER_TEMP/summary.md" --base main --head "$branch"
